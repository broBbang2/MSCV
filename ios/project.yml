# xcodegen 설정. `cd ios && xcodegen`으로 FirstCV.xcodeproj를 만든다 (프로젝트 파일은 git에 올리지 않는다).
# 모델은 ../runs/open2_s/weights/best_int8_nms.mlpackage를 FirstCV/Detector.mlpackage로 복사해서 쓴다.
name: FirstCV
options:
  bundleIdPrefix: dev.breeadee
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 75NG428Z32  # 개인 팀(Personal Team). 무료라 설치한 앱은 7일 뒤 다시 설치해야 한다
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  FirstCV:
    type: application
    platform: iOS
    sources: [FirstCV]
    info:
      path: FirstCV/Info.plist
      properties:
        CFBundleDisplayName: firstCV
        NSCameraUsageDescription: 카메라에 비친 물건을 실시간으로 인식합니다.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.breeadee.firstcv
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
