[project]
name = "firstcv"
version = "0.1.0"
description = "무선 아이폰 카메라로 일상 사물을 실시간 인식하는 객체 탐지 프로젝트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3,<9",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ipykernel>=6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
